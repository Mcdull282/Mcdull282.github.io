# ===================================
#  麦兜的博客 · Hexo 配置
# ===================================

title: 麦兜
subtitle: '烂昭昭兮未央'
description: '记录日常与心情的小站。'
keywords:
author: 麦兜
language: zh-CN
timezone: 'Asia/Shanghai'

# --- 网址 ---
url: https://mcdull282.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# --- 目录 ---
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# --- 写作 ---
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude:
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# --- 首页分页 ---
index_generator:
  path: ''
  per_page: 8
  order_by: -date

default_category: 随笔
category_map:
tag_map:

meta_generator: true

# --- 日期格式 ---
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

per_page: 8
pagination_dir: page

# --- 扩展 ---
include:
exclude:
ignore:

# --- 主题 ---
theme: butterfly

# --- 部署（用 GitHub Actions，这里留空）---
deploy:
  type: ''

# --- 站内搜索（hexo-generator-searchdb）---
search:
  path: search.xml
  field: post
  content: true
  format: html
